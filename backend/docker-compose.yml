# 로컬 개발용 PostgreSQL (Docker가 없다면 로컬에 설치한 PostgreSQL 16을 사용해도 됩니다)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgm
    ports:
      - "5432:5432"
    volumes:
      - pgm-data:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgm-data:
